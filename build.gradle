plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
loom {
    accessWidenerPath = file('src/main/resources/champ-seed-xray.accesswidener')
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:17.0.1"
    modLocalRuntime "com.terraformersmc:modmenu:17.0.1"
}
processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

loom {
    runs {
        client {
            client()
            runDir 'run'
            if (project.hasProperty('quickPlay')) {
                programArg '--quickPlaySingleplayer'
                programArg project.property('quickPlay')
            }
        }
    }
}
